<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background:#0f1225; color:white; }
    h1, h2 { text-align: center; }
    form { margin: 10px 0; }
    input { padding:5px; }
    button { padding:5px 8px; margin-left:5px; cursor:pointer; }
    ul { list-style:none; padding-left:0; }
    li { margin-bottom:8px; }
    .done { text-decoration: line-through; opacity:0.6; }
  </style>
</head>
<body>

<h1>📚 Study Planner</h1>

<!-- ADD TASK -->
<form action="/add" method="POST">
  <input name="task" placeholder="New task" required>
  <button type="submit">Add</button>
</form>

<hr>

<!-- TODO TASKS -->
<h2>📝 Tasks To Do</h2>
<ul>
  {% for task in todo_tasks %}
  <li>
    <!-- TASK TEXT -->
    {{ task.text }}

    <!-- MARK DONE -->
    <form action="/done/{{ task.id }}" method="POST" style="display:inline;">
      <button>✔</button>
    </form>

    <!-- EDIT -->
    <form action="/edit/{{ task.id }}" method="POST" style="display:inline;">
      <input name="new_text" value="{{ task.text }}" required>
      <button>✏</button>
    </form>
  </li>
  {% else %}
  <p>No tasks yet</p>
  {% endfor %}
</ul>

<hr>

<!-- FINISHED TASKS -->
<h2>✅ Finished Tasks</h2>
<ul>
  {% for task in done_tasks %}
  <li class="done">{{ task.text }}</li>
  {% else %}
  <p>No finished tasks</p>
  {% endfor %}
</ul>

</body>
</html>
