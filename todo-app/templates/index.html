<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mohammed Alotayfi-23170</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h1>📚 Study Planner</h1>

  <!-- ADD TASK -->
  <form action="/add" method="POST" class="add-form">
    <input name="task" placeholder="What needs to be done?" required autofocus>
    <button type="submit">Add Task</button>
  </form>

  <hr>

  <!-- TODO TASKS -->
  <h2>📝 Tasks To Do</h2>
  <ul>
    {% for task in todo_tasks %}
    <li>
      <form action="/toggle/{{ task.id }}" method="POST" style="display:inline;">
        <input type="checkbox" name="done" onchange="this.form.submit()" title="Mark as done">
      </form>

      <form action="/edit/{{ task.id }}" method="POST" style="display:flex; gap:8px; flex:1;">
        <input type="text" name="new_text" value="{{ task.text }}" required>
        <button type="submit" title="Save changes">✏</button>
      </form>
    </li>
    {% else %}
    <p>No tasks yet</p>
    {% endfor %}
  </ul>

  <hr>

  <!-- FINISHED TASKS -->
  <h2>✅ Finished Tasks</h2>
  <ul>
    {% for task in done_tasks %}
    <li class="done">
      <form action="/toggle/{{ task.id }}" method="POST" style="display:inline;">
        <input type="checkbox" name="done" onchange="this.form.submit()" checked title="Mark as to-do">
      </form>

      <form action="/edit/{{ task.id }}" method="POST" style="display:flex; gap:8px; flex:1;">
        <input type="text" name="new_text" value="{{ task.text }}" required>
        <button type="submit" title="Save changes">✏</button>
      </form>
    </li>
    {% else %}
    <p>No finished tasks yet</p>
    {% endfor %}
  </ul>

</div>

</body>
</html>
